[project]
name = "shadowledger-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.7,<3.0",
  "anthropic>=0.34,<1.0",
  "openai>=1.66,<2.0",
  "cryptography>=43.0,<47.0",
  "python-dotenv>=1.0,<2.0",
  "PyJWT>=2.10,<3.0",
  "httpx>=0.27,<1.0",
  "reportlab>=4.2,<5.0",
  "vercel-workflow==0.12.0",
]

[dependency-groups]
dev = ["pytest>=8.2,<9.0", "pytest-cov>=5.0,<7.0"]

[[tool.vercel.workflows]]
entrypoint = "app.workflows:wf"
